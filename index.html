<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Kalvetua</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kalvetua’s corner of the web, home of the Arcade.">
<style>
  /* Layout: one left-aligned column. Name, a short line, then the Arcade as a large door-like link,
     with a quiet row of secondary links below. Same palette and fonts as the Arcade so they read as one site. */
  @font-face { font-family: "Bungee"; font-weight: 400; font-display: swap; src: url(fonts/bungee-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: swap; src: url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); }
  :root {
    color-scheme: dark;
    --ground: #0d1f2a;
    --board: #122c3a;
    --grid: #183847;
    --ink: #e8f1f2;
    --muted: #8fb0b8;
    --snake: #ff8a5c;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); font-family: var(--mono);
    padding: clamp(32px, 9vh, 96px) 16px 32px;
  }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  h1 {
    font-family: var(--display); font-weight: 400; margin: 0; line-height: 0.95;
    font-size: clamp(2.8rem, 13vw, 5.2rem); color: var(--ink); letter-spacing: 0.01em;
  }

  .door {
    display: grid; gap: 14px; padding: 24px; border-radius: 6px; text-decoration: none; color: var(--ink);
    background: var(--board); box-shadow: 0 0 0 2px var(--grid), 0 24px 50px -30px #000;
    transition: box-shadow 140ms ease;
  }
  .door:hover, .door:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--snake), 0 24px 50px -30px #000; }
  .door h2 { font-family: var(--display); font-weight: 400; margin: 0; font-size: 2rem; color: var(--snake); }
  .door p { margin: 0; line-height: 1.6; font-size: 0.92rem; }
  .door .hint { color: var(--muted); font-size: 0.8rem; }
  kbd { font-family: var(--mono); border: 1px solid var(--grid); border-radius: 3px; padding: 0 5px; background: var(--ground); color: var(--ink); }

  /* One swatch per game, in each game's own color: a glimpse of what's inside. */
  .swatches { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; max-width: 340px; }
  .swatches span { aspect-ratio: 1; border-radius: 2px; background: var(--c); }

  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  footer { color: var(--muted); font-size: 0.75rem; }
  @media (prefers-reduced-motion: reduce) { .door { transition: none; } }
</style>

<main>
  <header>
    <h1>Kalvetua</h1>
  </header>

  <a class="door" href="arcade/" id="arcade">
    <h2>Arcade</h2>
    <div class="swatches" aria-hidden="true" id="sw"></div>
    <p>Twenty-four keyboard-friendly browser games: arcade classics with a twist, quizzes, brain teasers, daily puzzles, and a few games for practicing IT basics.</p>
    <p class="hint">Press <kbd>Enter</kbd> to play.</p>
  </a>

  <footer>© <span id="y">2026</span> Kalvetua</footer>
</main>

<script>
  // Colors of the games in the Arcade, in hub order.
  ['#5ce0a0', '#7cc7ff', '#f4b860', '#b9a7ff', '#ff6b6b', '#ffd166', '#ff8a5c', '#5ce0a0', '#f4b860', '#6fd3c6', '#ff7a90', '#7cc7ff',
   '#ff9bd2', '#a0e75a', '#ffe066', '#4be38a', '#7ee0ff', '#f78c6c', '#82aaff', '#c792ea', '#89ddff', '#c3e88d', '#ffcb6b', '#f07178']
    .forEach(c => { const s = document.createElement('span'); s.style.setProperty('--c', c); document.getElementById('sw').append(s); });
  document.getElementById('y').textContent = new Date().getFullYear();
  // Keyboard-first: the Arcade link has focus from the start, so Enter opens it.
  document.getElementById('arcade').focus({ preventScroll: true });
</script>

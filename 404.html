<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Page not found</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0d1f2a">
<style>
  /* Shown by GitHub Pages for any missing address, so every path here is absolute. */
  @font-face { font-family: "Bungee"; font-weight: 400; font-display: swap; src: url(/fonts/bungee-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); }
  :root { color-scheme: dark; --ground: #0d1f2a; --grid: #183847; --ink: #e8f1f2; --muted: #8fb0b8; --snake: #ff8a5c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; padding: clamp(32px, 12vh, 120px) 16px 32px; }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-family: "Bungee", "Arial Black", Impact, sans-serif; font-weight: 400; margin: 0; font-size: clamp(2.2rem, 10vw, 3.6rem); line-height: 1; }
  p { margin: 0; color: var(--muted); line-height: 1.6; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a { text-decoration: none; padding: 10px 18px; border-radius: 4px; font-weight: 600; }
  .links a:first-child { background: var(--snake); color: var(--ground); }
  .links a:last-child { color: var(--ink); box-shadow: inset 0 0 0 1px var(--grid); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>

<main>
  <h1>Page not found</h1>
  <p>There’s nothing at this address. It may have moved, or the link may have a typo.</p>
  <p class="links"><a href="/" id="home">Go to the main page</a><a href="/arcade/">Go to the Arcade</a></p>
</main>
<script>document.getElementById('home').focus();</script>
